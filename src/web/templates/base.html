<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="World Bank Indicators APIの公開データを取得・集計・可視化する学習用ダッシュボード">
    <title>{{ title }} | World Data Lens</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">本文へ移動</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ url_for('web.dashboard') }}" aria-label="World Data Lens トップ">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span>
            <strong>World Data Lens</strong>
            <small>OPEN DATA DASHBOARD</small>
          </span>
        </a>
        <nav class="main-nav" aria-label="メインナビゲーション">
          <a class="{{ 'active' if request.endpoint == 'web.dashboard' else '' }}" href="{{ url_for('web.dashboard') }}">概要</a>
          <a class="{{ 'active' if request.endpoint == 'web.data_list' else '' }}" href="{{ url_for('web.data_list') }}">データ一覧</a>
          <a class="{{ 'active' if request.endpoint == 'web.charts' else '' }}" href="{{ url_for('web.charts') }}">グラフ分析</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div>
        <strong>World Data Lens</strong>
        <p>学習目的の小規模オープンデータアプリケーション</p>
      </div>
      <p>Data: <a href="https://data.worldbank.org/" target="_blank" rel="noopener noreferrer">World Bank Open Data</a> / CC BY 4.0</p>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
