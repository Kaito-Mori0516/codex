name: Test World Data Lens

on:
  pull_request:
  push:
    branches: [main, codex/data-dashboard]

permissions:
  contents: read

jobs:
  test-and-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r infrastructure/requirements-dev.txt
      - name: Test local application
        run: python -m pytest -q
      - name: Test CDK application
        working-directory: infrastructure
        run: python -m pytest -q
      - name: Synthesize CloudFormation
        working-directory: infrastructure
        run: npx --yes aws-cdk@2.1138.0 synth --context environment=dev --quiet
